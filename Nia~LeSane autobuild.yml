name: Nia AutoBuilder (Safe)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  push:
    paths:
      - niabrain/**
      - agents/**
      - workflows/**

permissions:
  contents: write
  pull-requests: write

jobs:
  autobuild:
    runs-on: ubuntu-latest
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      NIA_BUDGET_USD: "25.00"

    steps:
      - uses: actions/checkout@v4

      - name: Budget Gate
        run: |
          python niabrain/governance/budget_guard.py

      - name: Run Nia AutoBuilder
        run: |
          python niabrain/autobuilder/run.py \
            --mode propose \
            --output ./nia_changes

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Nia: Autonomous Improvement Proposal"
          body: |
            This PR was generated by Nia under budget and safety constraints.
          branch: nia/autobuild-${{ github.run_id }}
